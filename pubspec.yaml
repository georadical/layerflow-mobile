name: layerflow_capture
description: "LayerFlow — App móvil de captura de placas (censo, coordinate-free)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.5.1

  # Persistencia local (offline-first)
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Red
  dio: ^5.4.3

  # Evidencia de placa (Spec 7, T7.4c): cámara por captura + compresión
  # JPEG en cliente (tope del contrato: 500KB / lado 1600px).
  camera: ^0.11.0
  image: ^4.2.0

  # Utilidades
  uuid: ^4.4.0
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  flutter_lints: ^4.0.0
  # Only for tests: points drift at the system libsqlite3 so the repository
  # tests actually run instead of skipping themselves.
  sqlite3: ^2.9.4

flutter:
  uses-material-design: true
